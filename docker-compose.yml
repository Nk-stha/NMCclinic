services:
  web:
    build:
      context: .
      target: production
    restart: unless-stopped
    ports:
      - "0.0.0.0:${PORT:-8082}:80"
    environment:
      NMC_DB_HOST: ${NMC_DB_HOST:?Set NMC_DB_HOST in .env}
      NMC_DB_NAME: ${NMC_DB_NAME:-clinic}
      NMC_DB_USER: ${NMC_DB_USER:-root}
      NMC_DB_PASS: ${NMC_DB_PASS:-}
      SITE_URL: ${SITE_URL:-http://localhost:${PORT:-8082}}
    volumes:
      - uploads:/var/www/html/uploads
    networks:
      - coolify
      - default

volumes:
  uploads:

networks:
  coolify:
    external: true
